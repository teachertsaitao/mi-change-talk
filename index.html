<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>改變談話與維持談話｜朗讀稿</title>
<meta name="description" content="動機式晤談改變談話辨識練習．兩人一組朗讀與聆聽">
<meta name="theme-color" content="#5A6472">
<style>
:root{
  --ink:#2E343D; --slate:#5A6472; --taupe:#9C8F82;
  --sand:#EFEAE3; --paper:#FAF8F5; --card:#FFFFFF; --line:#E2DCD4;
  --chg:#3F6B4E; --chg-bg:#DDE8DE; --chg-mid:#7FA88E;
  --sus:#8E4E58; --sus-bg:#F0DFE0; --sus-mid:#C08E96;
  --neu:#D9D3CB;
  --serif:"Songti TC","Noto Serif TC","Source Han Serif TC",
          "PMingLiU","MingLiU",Georgia,"Times New Roman",serif;
  --sans:"PingFang TC","Noto Sans TC","Source Han Sans TC",
         "Microsoft JhengHei","Helvetica Neue",Helvetica,Arial,sans-serif;
  --fs:19px; --lh:2.0;
  --wrap:720px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--slate);outline-offset:3px;border-radius:3px}

/* ---------- 頁首 ---------- */
.top{background:var(--slate);color:#fff;padding:16px 0 14px}
.top .wrap{display:block}
.brand{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.02em;line-height:1.3}
.brand small{display:block;font-family:var(--sans);font-size:11.5px;font-weight:400;
  letter-spacing:.06em;color:#C3CAD3;margin-top:3px}

/* ---------- 首頁 ---------- */
.intro{padding:26px 0 4px}
.intro p{margin:0;font-size:14.5px;color:#6A7280;line-height:1.85}
.intro .hint{margin-top:9px;font-size:13px;color:var(--taupe)}

.filters{display:flex;flex-wrap:wrap;gap:6px;padding:18px 0 6px}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:6px 12px;font-size:12.5px;color:#6A7280;transition:.16s;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--slate);border-color:var(--slate);color:#fff}
.filters .sep{width:1px;background:var(--line);margin:5px 3px}

.list{padding:8px 0 40px;display:flex;flex-direction:column;gap:11px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:15px 17px 16px;transition:.16s}
.card:hover,.card:focus-visible{border-color:var(--taupe);transform:translateY(-1px)}
.card-h{display:flex;align-items:baseline;gap:11px;margin-bottom:5px}
.card-n{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--slate);flex:none;line-height:1}
.card-t{font-size:16px;font-weight:600;color:var(--ink);line-height:1.45}
.card-m{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:11.5px;padding:2px 8px;border-radius:4px;letter-spacing:.03em}
.tag-a{background:var(--sand);color:#6E6257}
.card-s{font-size:12px;color:var(--taupe);margin-left:auto}

/* ---------- 語言脈絡帶 ---------- */
.ribbon{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--neu)}
.ribbon span{display:block;height:100%;transition:background .5s ease}
.ribbon.plain span{background:var(--neu)!important}
.rb-c{background:var(--chg-mid)}
.rb-s{background:var(--sus-mid)}
.rb-n{background:var(--neu)}
.ribbon.big{height:13px;border-radius:7px}
.ribbon.reveal span{animation:fill .5s ease both}
@keyframes fill{from{opacity:.25}to{opacity:1}}
.rb-legend{display:flex;gap:14px;font-size:11.5px;color:var(--taupe);margin-top:7px}
.rb-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- 段落頁 ---------- */
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:#6A7280;padding:16px 0 4px}
.head{padding:2px 0 16px;border-bottom:1px solid var(--line)}
.head-n{font-family:var(--serif);font-size:13.5px;letter-spacing:.08em;color:var(--taupe);margin-bottom:5px}
.head-t{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.4;color:var(--ink);margin:0 0 11px}
.head-m{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:13px}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-top:2px;position:sticky;top:0;
  background:var(--paper);z-index:5}
.tabs button{flex:1;padding:14px 4px 12px;font-size:14.5px;color:#8A9099;border-bottom:2px solid transparent;
  transition:.16s;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--slate);border-bottom-color:var(--slate);font-weight:700}
.tabs button[disabled]{color:#C4C8CE;cursor:default}

.pane{padding:22px 0 56px}
.tools{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.tools span{font-size:12.5px;color:var(--taupe);margin-right:2px}
.tools button{border:1px solid var(--line);background:var(--card);border-radius:7px;
  min-width:38px;padding:5px 10px;font-size:13px;color:#6A7280}
.tools button[aria-pressed="true"]{background:var(--slate);border-color:var(--slate);color:#fff}

.script p{font-size:var(--fs);line-height:var(--lh);margin:0 0 1.15em;letter-spacing:.01em}
.script mark{background:none;color:inherit;padding:0}
.script.marked mark.c{background:var(--chg-bg);color:var(--chg);font-weight:600;
  padding:2px 1px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.script.marked mark.s{background:var(--sus-bg);color:var(--sus);font-weight:600;
  padding:2px 1px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}

.note{background:var(--sand);border-radius:10px;padding:14px 17px;font-size:13.5px;
  line-height:1.85;color:#5F5449;margin:0 0 22px}
.note b{color:var(--ink)}

/* ---------- 計數 ---------- */
.count-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.counter{border-radius:14px;padding:20px 12px 16px;text-align:center;border:1px solid transparent;
  transition:transform .08s}
.counter:active{transform:scale(.97)}
.counter.c{background:var(--chg-bg);border-color:#C6DACB}
.counter.s{background:var(--sus-bg);border-color:#E4CBCE}
.counter-l{font-size:13.5px;font-weight:700;letter-spacing:.04em}
.counter.c .counter-l{color:var(--chg)}
.counter.s .counter-l{color:var(--sus)}
.counter-v{font-family:var(--serif);font-size:52px;font-weight:700;line-height:1.1;margin:4px 0 2px}
.counter.c .counter-v{color:var(--chg)}
.counter.s .counter-v{color:var(--sus)}
.counter-h{font-size:11.5px;color:#8A8078}
.count-row{display:flex;gap:8px;justify-content:center;margin-bottom:22px}
.count-row button{border:1px solid var(--line);background:var(--card);border-radius:8px;
  padding:7px 16px;font-size:13px;color:#6A7280}

/* ---------- 對答案 ---------- */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.cmp{border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:var(--card)}
.cmp-l{font-size:12.5px;font-weight:700;margin-bottom:7px}
.cmp.c .cmp-l{color:var(--chg)}
.cmp.s .cmp-l{color:var(--sus)}
.cmp-r{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--taupe)}
.cmp-r b{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--ink)}

table.key{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:8px}
table.key th{background:var(--taupe);color:#fff;font-weight:700;text-align:left;
  padding:9px 12px;font-size:12.5px;letter-spacing:.03em}
table.key td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6}
table.key tr:nth-child(even) td{background:#FBF9F7}
table.key td.j{white-space:nowrap;font-weight:600;font-size:13px}
table.key td.j.c{color:var(--chg)}
table.key td.j.s{color:var(--sus)}
table.key td.j.n{color:var(--taupe)}

.stats{display:flex;flex-wrap:wrap;gap:18px;font-size:12.5px;color:var(--taupe);
  padding:14px 0 0;border-top:1px solid var(--line);margin-top:20px}
.stats b{color:var(--ink);font-weight:600}


h3.sec{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--slate);
  margin:30px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}

.foot{padding:30px 0 46px;font-size:12px;color:#B3ADA5;text-align:center;line-height:1.9}

@media(max-width:520px){
  .head-t{font-size:22px}
  .counter-v{font-size:44px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media print{
  .top,.tabs,.tools,.back,.filters,.foot,.count-row{display:none!important}
  body{background:#fff;font-size:12pt}
  .script p{font-size:12pt;line-height:1.9}
  .pane{padding:0}
}
</style>
</head>

  <div class="wrap">

    </div>
  </div>

<script>
(function(){
  "use strict";
  var S = window.SEGMENTS || [];
  var app = document.getElementById("app");

  if(!S.length){
    app.innerHTML='<div class="wrap" style="padding:60px 20px;text-align:center;color:#6A7280">'+
      '<p style="font-size:16px;margin:0 0 10px"><b>找不到朗讀稿資料</b></p>'+
      '<p style="font-size:14px;line-height:1.9;margin:0">這一頁需要和 data.js 放在同一個資料夾才會有內容。<br>'+
      '如果你用的是單檔版，代表檔案不完整，請重新下載。</p></div>';
    return;
  }

  /* ---------- 狀態 ---------- */
  var store = {
    get:function(k,d){ try{ var v=localStorage.getItem("mi_"+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
    set:function(k,v){ try{ localStorage.setItem("mi_"+k, JSON.stringify(v)); }catch(e){} }
  };
  var state = {
    fs:   store.get("fs",1),   // 0 小 1 中 2 大
    fa:   "全部",
    tab:  "read",
    tally:{c:0,s:0}, tallyId:null
  };
  var FS=["17px","19px","22px"], LH=["1.95","2.0","2.05"];

  function applyFS(){
    document.documentElement.style.setProperty("--fs",FS[state.fs]);
    document.documentElement.style.setProperty("--lh",LH[state.fs]);
  }
  applyFS();

  /* ---------- 工具 ---------- */
  function el(tag,cls,txt){ var e=document.createElement(tag); if(cls)e.className=cls;
    if(txt!==undefined)e.textContent=txt; return e; }
  function len(t){ return t.replace(/[，。？…、！　]/g,"").length; }
  function runs(seg){ var r=[]; seg.paras.forEach(function(p){ p.forEach(function(x){ r.push(x); }); }); return r; }

  function ribbon(seg,opts){
    opts=opts||{};
    var wrap=el("div","ribbon"+(opts.big?" big":"")+(opts.plain?" plain":"")+(opts.reveal?" reveal":""));
    var rs=runs(seg), total=0;
    rs.forEach(function(x){ total+=len(x[0]); });
    rs.forEach(function(x){
      var s=el("span"); s.className="rb-"+x[1];
      s.style.flex=len(x[0])+" 0 0"; wrap.appendChild(s);
    });
    wrap.setAttribute("role","img");
    wrap.setAttribute("aria-label", opts.plain ? "語言脈絡帶，尚未顯示" :
      "語言脈絡帶：改變談話 "+seg.stats.chg+"%，維持談話 "+seg.stats.sus+"%，中性 "+seg.stats.neu+"%");
    return wrap;
  }

  /* ---------- 首頁 ---------- */
  function home(){
    app.innerHTML="";
    var w=el("div","wrap");

    var intro=el("div","intro");
    intro.appendChild(el("p","","兩人一組，一個人念，另一個人聽。挑一段開始。"));
    var h=el("p","hint");
    h.textContent="念的人看「朗讀稿」，聽的人用「計數」。念完之後一起打開「對答案」。";
    intro.appendChild(h);
    w.appendChild(intro);

    // 篩選
    var f=el("div","filters");
    ["全部","教師","家長"].forEach(function(v){
      var b=el("button",null,v); b.setAttribute("aria-pressed",state.fa===v);
      b.onclick=function(){ state.fa=v; home(); }; f.appendChild(b);
    });
    w.appendChild(f);

    // 清單
    var list=el("div","list");
    var shown=S.filter(function(s){
      return (state.fa==="全部"||s.audience===state.fa);
    });
    if(!shown.length){
      var none=el("p"); none.style.cssText="color:#8A9099;font-size:14px;padding:20px 0";
      none.textContent="這個條件下沒有段落。"; list.appendChild(none);
    }
    shown.forEach(function(seg){
      var c=el("button","card");
      c.onclick=function(){ location.hash="#/"+seg.id; };

      var hd=el("div","card-h");
      hd.appendChild(el("div","card-n",seg.num));
      hd.appendChild(el("div","card-t",seg.title));
      c.appendChild(hd);

      var m=el("div","card-m");
      m.appendChild(el("span","tag tag-a",seg.audience+"諮詢"));
      m.appendChild(el("span","card-s","約 "+seg.stats.sec+" 秒"));
      c.appendChild(m);
      list.appendChild(c);
    });
    w.appendChild(list);
    app.appendChild(w);
    window.scrollTo(0,0);
  }

  /* ---------- 段落頁 ---------- */
  function detail(seg){
    if(state.tallyId!==seg.id){ state.tally={c:0,s:0}; state.tallyId=seg.id; }
    app.innerHTML="";
    var w=el("div","wrap");

    var back=el("button","back","← 全部段落");
    back.onclick=function(){ location.hash=""; };
    w.appendChild(back);

    var hd=el("div","head");
    hd.appendChild(el("div","head-n","段落"+seg.num));
    hd.appendChild(el("h1","head-t",seg.title));
    var m=el("div","head-m");
    m.appendChild(el("span","tag tag-a",seg.audience+"諮詢"));
    var sp=el("span","card-s","約 "+seg.stats.sec+" 秒　"+seg.stats.chars+" 字");
    sp.style.marginLeft="auto"; m.appendChild(sp);
    hd.appendChild(m);
    hd.appendChild(ribbon(seg,{big:true, plain: state.tab!=="key", reveal: state.tab==="key"}));
    w.appendChild(hd);

    // 分頁
    var tabs=el("div","tabs"); tabs.setAttribute("role","tablist");
    [["read","朗讀稿"],["count","計數"],["key","對答案"]].forEach(function(t){
      var b=el("button",null,t[1]);
      b.setAttribute("role","tab");
      b.setAttribute("aria-selected", state.tab===t[0]);
      b.onclick=function(){ state.tab=t[0]; detail(seg); };
      tabs.appendChild(b);
    });
    w.appendChild(tabs);

    var pane=el("div","pane");
    if(state.tab==="read") readPane(pane,seg);
    else if(state.tab==="count") countPane(pane,seg);
    else keyPane(pane,seg);
    w.appendChild(pane);

    app.appendChild(w);
    window.scrollTo(0,0);
  }

  function fontTools(pane,seg,extra){
    var t=el("div","tools");
    t.appendChild(el("span",null,"字級"));
    ["小","中","大"].forEach(function(lb,i){
      var b=el("button",null,lb);
      b.setAttribute("aria-pressed", state.fs===i);
      b.onclick=function(){ state.fs=i; store.set("fs",i); applyFS(); detail(seg); };
      t.appendChild(b);
    });
    if(extra) t.appendChild(extra);
    pane.appendChild(t);
  }

  function scriptEl(seg,marked){
    var d=el("div","script"+(marked?" marked":""));
    seg.paras.forEach(function(p){
      var pe=el("p");
      p.forEach(function(x){
        var mk=el("mark",x[1]); mk.textContent=x[0]; pe.appendChild(mk);
      });
      d.appendChild(pe);
    });
    return d;
  }

  function readPane(pane,seg){
    fontTools(pane,seg);
    var n=el("div","note");
    n.innerHTML="<b>念之前先默讀一遍。</b>當作在跟朋友抱怨，不要當作在讀課文。語速正常就好。同一段念兩遍，中間停三十秒。<br>負責聽的人先不要看這一頁，直接切到「計數」。";
    pane.appendChild(n);
    pane.appendChild(scriptEl(seg,false));
  }

  function countPane(pane,seg){
    var n=el("div","note");
    n.innerHTML="<b>第一遍只聽，不寫字。</b>每聽到一句就點一下。第二遍再回頭記關鍵詞。";
    pane.appendChild(n);

    var g=el("div","count-grid");
    [["c","改變談話"],["s","維持談話"]].forEach(function(x){
      var b=el("button","counter "+x[0]);
      b.appendChild(el("div","counter-l",x[1]));
      b.appendChild(el("div","counter-v",String(state.tally[x[0]])));
      b.appendChild(el("div","counter-h","點一下 +1"));
      b.setAttribute("aria-label",x[1]+"計數，目前 "+state.tally[x[0]]);
      b.onclick=function(){
        state.tally[x[0]]++;
        b.querySelector(".counter-v").textContent=state.tally[x[0]];
        b.setAttribute("aria-label",x[1]+"計數，目前 "+state.tally[x[0]]);
        if(navigator.vibrate) navigator.vibrate(8);
      };
      g.appendChild(b);
    });
    pane.appendChild(g);

    var row=el("div","count-row");
    var m1=el("button",null,"改變 −1");
    m1.onclick=function(){ if(state.tally.c>0){state.tally.c--; detail(seg);} };
    var m2=el("button",null,"維持 −1");
    m2.onclick=function(){ if(state.tally.s>0){state.tally.s--; detail(seg);} };
    var rs=el("button",null,"歸零");
    rs.onclick=function(){ state.tally={c:0,s:0}; detail(seg); };
    row.appendChild(m1); row.appendChild(m2); row.appendChild(rs);
    pane.appendChild(row);

    var tip=el("div","note");
    tip.innerHTML="兩種語言常出現在同一口氣裡，順序通常是<b>改變在前、維持在後</b>。聽到「我是想試試看啦」的時候，就要準備好接住後面那半句。";
    pane.appendChild(tip);
  }

  function keyPane(pane,seg){
    // 你數到 vs 實際
    if(state.tally.c || state.tally.s){
      var cmp=el("div","compare");
      [["c","改變談話",state.tally.c,seg.stats.nChg],["s","維持談話",state.tally.s,seg.stats.nSus]]
      .forEach(function(x){
        var d=el("div","cmp "+x[0]);
        d.appendChild(el("div","cmp-l",x[1]));
        var r=el("div","cmp-r");
        var b=el("b",null,x[2]+" / "+x[3]);
        r.appendChild(b);
        r.appendChild(el("span",null,"你數到 / 實際"));
        d.appendChild(r);
        cmp.appendChild(d);
      });
      pane.appendChild(cmp);
    }

    fontTools(pane,seg);

    var lg=el("div","rb-legend");
    lg.innerHTML='<span><i style="background:var(--chg-bg);border:1px solid var(--chg)"></i>改變談話</span>'+
                 '<span><i style="background:var(--sus-bg);border:1px solid var(--sus)"></i>維持談話</span>'+
                 '<span><i style="background:#fff;border:1px solid var(--line)"></i>中性或值得肯認的價值訊號</span>';
    lg.style.marginBottom="16px";
    pane.appendChild(lg);

    pane.appendChild(scriptEl(seg,true));

    pane.appendChild(el("h3","sec","語句整理"));
    var tb=el("table","key");
    var thead=el("thead"), tr=el("tr");
    ["語句","判讀"].forEach(function(h){ var th=el("th",null,h); tr.appendChild(th); });
    thead.appendChild(tr); tb.appendChild(thead);
    var tbody=el("tbody");
    seg.key.forEach(function(k){
      var r=el("tr");
      r.appendChild(el("td",null,k[0]));
      var kind = k[1].indexOf("改變")===0 ? "c" : (k[1].indexOf("維持")===0 ? "s" : "n");
      r.appendChild(el("td","j "+kind,k[1]));
      tbody.appendChild(r);
    });
    tb.appendChild(tbody);
    pane.appendChild(tb);

    var st=el("div","stats");
    st.innerHTML =
      "<span>改變談話 <b>"+seg.stats.chg+"%</b></span>"+
      "<span>維持談話 <b>"+seg.stats.sus+"%</b></span>"+
      "<span>中性 <b>"+seg.stats.neu+"%</b></span>"+
      "<span>改／維字數比 <b>"+seg.stats.ratio+"</b></span>";
    pane.appendChild(st);

    var last=el("div","note"); last.style.marginTop="22px";
    last.innerHTML="<b>先討論最後一句。</b>每一段都以一句折價收尾。聽的人常常因為那一句，把整段的印象記成「這個人沒有動機」，回頭數的時候就低估了改變談話。";
    pane.appendChild(last);
  }

  /* ---------- 路由 ---------- */
  function route(){
    var h=location.hash.replace(/^#\/?/,"");
    var id=parseInt(h,10);
    if(id && S.some(function(s){return s.id===id;})){
      detail(S.filter(function(s){return s.id===id;})[0]);
    } else {
      state.tab="read";
      home();
    }
  }
  window.addEventListener("hashchange",route);
  route();
})();
</script>
