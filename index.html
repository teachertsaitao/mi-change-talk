<!DOCTYPE html>
<!-- 動機式晤談練習　v17　2026-11-05 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>動機式晤談練習</title>
<meta name="description" content="OARS日常對話練習、OARS訪談練習、OARS諮詢情境練習、辨識改變型對話、AI諮詢技巧練習機器人與諮詢實務演練，工作坊用的練習工具">
<meta name="theme-color" content="#5A6472">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MI練習">
<style>
:root{
  --ink:#2E343D; --slate:#5A6472; --taupe:#9C8F82;
  --sand:#EFEAE3; --paper:#FAF8F5; --card:#FFFFFF; --line:#E2DCD4;
  --chg:#3F6B4E; --chg-bg:#DDE8DE; --chg-mid:#7FA88E;
  --sus:#8E4E58; --sus-bg:#F0DFE0; --sus-mid:#C08E96;
  --neu:#D9D3CB;
  --serif:"Songti TC","Noto Serif TC","Source Han Serif TC",
          "PMingLiU","MingLiU",Georgia,"Times New Roman",serif;
  --sans:"PingFang TC","Noto Sans TC","Source Han Sans TC",
         "Microsoft JhengHei","Helvetica Neue",Helvetica,Arial,sans-serif;
  --fs:19px; --lh:2.0;
  --wrap:720px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--slate);outline-offset:3px;border-radius:3px}

/* ---------- 頁首 ---------- */
.top{background:var(--slate);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 0 14px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px}
a.brand{display:inline-block;color:#fff;text-decoration:none;font-family:var(--serif);font-size:20px;
  font-weight:700;letter-spacing:.02em;line-height:1.3}
a.brand small{display:block;font-family:var(--sans);font-size:11.5px;font-weight:400;
  letter-spacing:.06em;color:#C3CAD3;margin-top:3px}

/* ---------- 首頁：兩個活動 ---------- */
.intro{padding:26px 0 4px}
.intro p{margin:0;font-size:14.5px;color:#6A7280;line-height:1.85}
.acts{display:flex;flex-direction:column;gap:14px;padding:24px 0 18px}
.act{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:20px 20px 18px;transition:.16s}
.act:hover,.act:focus-visible{border-color:var(--taupe);transform:translateY(-1px)}
.act-eye{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;color:var(--taupe);margin-bottom:6px}
.act-t{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--ink);line-height:1.35;margin-bottom:8px}
.act-d{font-size:14px;color:#5F6670;line-height:1.8;margin-bottom:12px}
.act-m{font-size:12px;color:var(--taupe)}

/* ---------- 清單 ---------- */
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:18px 0 6px}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:6px 12px;font-size:12.5px;color:#6A7280;transition:.16s;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--slate);border-color:var(--slate);color:#fff}

.list{padding:8px 0 40px;display:flex;flex-direction:column;gap:11px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:15px 17px 16px;transition:.16s}
.card:hover,.card:focus-visible{border-color:var(--taupe);transform:translateY(-1px)}
.card-h{display:flex;align-items:baseline;gap:11px;margin-bottom:5px}
.card-n{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--slate);flex:none;line-height:1}
.card-t{font-size:16px;font-weight:600;color:var(--ink);line-height:1.45}
.card-m{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:11.5px;padding:2px 8px;border-radius:4px;letter-spacing:.03em}
.tag-a{background:var(--sand);color:#6E6257}
.card-s{font-size:12px;color:var(--taupe);margin-left:auto}

/* ---------- 語言脈絡帶 ---------- */
.ribbon{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--neu)}
.ribbon span{display:block;height:100%;transition:background .5s ease}
.ribbon.plain span{background:var(--neu)!important}
.rb-c{background:var(--chg-mid)}
.rb-s{background:var(--sus-mid)}
.rb-n{background:var(--neu)}
.ribbon.big{height:13px;border-radius:7px}
.ribbon.reveal span{animation:fill .5s ease both}
@keyframes fill{from{opacity:.25}to{opacity:1}}
.rb-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--taupe);margin-top:7px}
.rb-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- 頁面標頭 ---------- */
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:#6A7280;padding:16px 0 4px}
.head{padding:2px 0 16px;border-bottom:1px solid var(--line)}
.head-n{font-family:var(--serif);font-size:13.5px;letter-spacing:.08em;color:var(--taupe);margin-bottom:5px}
.head-t{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.4;color:var(--ink);margin:0 0 11px}
.head-m{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:13px}
.head-p{margin:0;font-size:14.5px;color:#6A7280;line-height:1.85}
.head-p + .head-p{margin-top:4px;font-size:13px;color:var(--taupe)}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-top:2px;position:sticky;top:0;
  background:var(--paper);z-index:5}
.tabs button{flex:1;padding:14px 4px 12px;font-size:14.5px;color:#8A9099;border-bottom:2px solid transparent;
  transition:.16s;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--slate);border-bottom-color:var(--slate);font-weight:700}

.pane{padding:22px 0 56px}
.tools{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.tools span{font-size:12.5px;color:var(--taupe);margin-right:2px}
.tools button{border:1px solid var(--line);background:var(--card);border-radius:7px;
  min-width:38px;padding:5px 10px;font-size:13px;color:#6A7280}
.tools button[aria-pressed="true"]{background:var(--slate);border-color:var(--slate);color:#fff}

.note{background:var(--sand);border-radius:10px;padding:14px 17px;font-size:13.5px;
  line-height:1.85;color:#5F5449;margin:0 0 22px}
.note b{color:var(--ink)}

/* ---------- OARS：說明 ---------- */
.challenge{background:var(--slate);color:#fff;border-radius:10px;padding:12px 16px;font-size:15px;
  font-weight:700;letter-spacing:.02em;margin:18px 0 14px;line-height:1.6}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.steps li{display:flex;gap:11px;align-items:flex-start;font-size:14px;line-height:1.75;color:var(--ink)}
.step-n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--slate);color:#fff;
  font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}

/* ---------- OARS：獨白 ---------- */
.mono{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.mono p{margin:0;font-size:var(--fs);line-height:var(--lh);letter-spacing:.01em}

details.role{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
details.role summary{cursor:pointer;list-style:none;padding:13px 16px;font-size:14px;font-weight:600;
  color:var(--slate);display:flex;align-items:center;justify-content:space-between;gap:12px}
details.role summary::-webkit-details-marker{display:none}
details.role summary::after{content:"展開";flex:none;font-size:12px;font-weight:400;color:var(--taupe)}
details.role[open] summary::after{content:"收起"}
.role-b{padding:2px 16px 16px;border-top:1px solid var(--line);background:#FCFBF9}
.role-rule{font-size:13px;color:var(--taupe);margin:12px 0 2px;line-height:1.8}
.role-r{padding:11px 0;border-bottom:1px dashed var(--line)}
.role-r:last-child{border-bottom:none;padding-bottom:0}
.role-l{font-size:12.5px;font-weight:700;color:#6E6257;margin-bottom:3px}
.role-v{font-size:14.5px;line-height:1.85;color:var(--ink)}
.role-r ul{margin:2px 0 0;padding-left:1.2em;font-size:14.5px;line-height:1.85;color:var(--ink)}
.role-r li{margin:3px 0}

/* ---------- OARS：回應 ---------- */
.round{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;
  margin-bottom:16px;text-align:center}
.round-top{display:flex;align-items:baseline;justify-content:center;gap:7px;color:var(--taupe);font-size:14px}
.round-v{font-family:var(--serif);font-size:48px;font-weight:700;color:var(--slate);line-height:1}
.dots{display:flex;gap:8px;justify-content:center;margin:12px 0 10px}
.dot{width:30px;height:6px;border-radius:3px;background:var(--line)}
.dot.on{background:var(--slate)}
.dot.s.on{background:var(--taupe)}
.round-h{margin:0 0 14px;font-size:14px;color:#5F6670;line-height:1.7}
.round.last .round-h{color:var(--ink);font-weight:700}
.round-b{display:flex;gap:10px}
.btn1,.btn2{flex:1;border-radius:10px;padding:12px 10px;font-size:15px;font-weight:600}
.btn1{background:var(--slate);color:#fff}
.btn2{background:var(--card);border:1px solid var(--line);color:#6A7280}
.btn2[disabled]{opacity:.45;cursor:default}
.btn1[disabled]{opacity:.6;cursor:default}

.cues{display:flex;flex-direction:column;gap:9px}
.cue{display:flex;gap:13px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:13px 15px;transition:opacity .2s}
.cue.dim{opacity:.4}
.cue-k{flex:none;width:34px;height:34px;border-radius:9px;background:var(--slate);color:#fff;
  font-family:Georgia,"Times New Roman",serif;font-size:18px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.cue-n{font-size:15px;font-weight:700;color:var(--ink);line-height:1.5}
.cue-h{font-size:13.5px;color:#5F6670;line-height:1.7}
.cue-e{font-size:13.5px;color:var(--taupe);line-height:1.7;margin-top:2px}

/* ---------- OARS：回饋 ---------- */
.fbq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:10px}
.fbq.main{background:var(--slate);border-color:var(--slate);padding:18px 18px}
.fbq-w{font-size:12px;color:var(--taupe);letter-spacing:.06em;margin-bottom:4px}
.fbq.main .fbq-w{color:#C3CAD3}
.fbq-q{font-family:var(--serif);font-size:17px;font-weight:700;line-height:1.6;color:var(--ink)}
.fbq.main .fbq-q{color:#fff;font-size:20px}
.fb-gap{height:12px}

/* ---------- 改變型對話：朗讀稿 ---------- */
.script p{font-size:var(--fs);line-height:var(--lh);margin:0 0 1.15em;letter-spacing:.01em}
.script mark{background:none;color:inherit;padding:0}
.script.marked mark.c{background:var(--chg-bg);color:var(--chg);font-weight:600;
  padding:2px 1px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.script.marked mark.s{background:var(--sus-bg);color:var(--sus);font-weight:600;
  padding:2px 1px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* ---------- 改變型對話：計數 ---------- */
.count-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.counter{border-radius:14px;padding:20px 12px 16px;text-align:center;border:1px solid transparent;
  transition:transform .08s}
.counter:active{transform:scale(.97)}
.counter.c{background:var(--chg-bg);border-color:#C6DACB}
.counter.s{background:var(--sus-bg);border-color:#E4CBCE}
.counter-l{font-size:13.5px;font-weight:700;letter-spacing:.04em}
.counter.c .counter-l{color:var(--chg)}
.counter.s .counter-l{color:var(--sus)}
.counter-v{font-family:var(--serif);font-size:52px;font-weight:700;line-height:1.1;margin:4px 0 2px}
.counter.c .counter-v{color:var(--chg)}
.counter.s .counter-v{color:var(--sus)}
.counter-h{font-size:11.5px;color:#8A8078}
.count-row{display:flex;gap:8px;justify-content:center;margin-bottom:22px}
.count-row button{border:1px solid var(--line);background:var(--card);border-radius:8px;
  padding:7px 16px;font-size:13px;color:#6A7280}

/* ---------- 改變型對話：對答案 ---------- */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.cmp{border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:var(--card)}
.cmp-l{font-size:12.5px;font-weight:700;margin-bottom:7px}
.cmp.c .cmp-l{color:var(--chg)}
.cmp.s .cmp-l{color:var(--sus)}
.cmp-r{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:13px;color:var(--taupe)}
.cmp-r b{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--ink)}

table.key{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:8px}
table.key th{background:var(--taupe);color:#fff;font-weight:700;text-align:left;
  padding:9px 12px;font-size:12.5px;letter-spacing:.03em}
table.key td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6}
table.key tr:nth-child(even) td{background:#FBF9F7}
table.key td.j{white-space:nowrap;font-weight:600;font-size:13px}
table.key td.j.c{color:var(--chg)}
table.key td.j.s{color:var(--sus)}
table.key td.j.n{color:var(--taupe)}

.stats{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--taupe);
  padding:14px 0 0;border-top:1px solid var(--line);margin-top:20px}
.stats b{color:var(--ink);font-weight:600}

h3.sec{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--slate);
  margin:30px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}

.foot{padding:30px 0 46px;font-size:12px;color:#B3ADA5;text-align:center;line-height:1.9}
/* 個人介紹只放首頁；練習頁只留「練習素材，非真實個案」與版本號 */
body:not(.is-home) .foot .me{display:none}
body:not(.is-home) .foot{padding-top:6px}
body:not(.is-home) .foot .ver{margin-top:0}
.foot .who{font-size:13.5px;font-weight:700;color:#8F8880;letter-spacing:.06em;margin-bottom:2px}
.foot .ttl{color:#A39C94}
.foot .sep{margin:0 6px;color:#CFC8C0}
.foot .fb{margin-top:8px}
.foot .fb a{color:var(--taupe);font-weight:600;text-decoration:none;border-bottom:1px solid #D9D2C9;padding-bottom:1px}
.foot .fb a:hover{color:var(--slate);border-color:var(--slate)}
.foot .ver{margin-top:12px;font-size:11.5px;color:#BDB7AF}
@media(max-width:520px){
  .foot .seg{display:block}
  .foot .sep{display:none}
}

/* ---------- AI諮詢技巧練習機器人 ---------- */
a.btn1,a.btn2{display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn1.done{background:var(--ink)}
.cta{display:flex;gap:10px;margin:20px 0 4px}
.sec-p{margin:-4px 0 0;font-size:13.5px;color:#6A7280;line-height:1.8}
.list.tight{padding-bottom:16px}
.aic{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:13px 13px 13px 16px;transition:border-color .2s,box-shadow .2s}
.aic.hl{border-color:var(--slate);box-shadow:0 0 0 3px rgba(90,100,114,.14)}
.aic-k{flex:none;width:22px;text-align:center;font-family:Georgia,"Times New Roman",serif;
  font-size:22px;font-weight:700;color:var(--slate)}
.aic-b{flex:1;min-width:0}
.aic-t{font-size:15.5px;font-weight:600;color:var(--ink);line-height:1.5}
.aic-m{font-size:12px;color:var(--taupe);margin-top:2px;line-height:1.6}
.cp{flex:none;border:1px solid var(--slate);color:var(--slate);background:var(--card);border-radius:9px;
  padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap;transition:.15s}
.cp.done{background:var(--slate);color:#fff}
.cmds{margin:0;padding:0;list-style:none}
.cmds li{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.cmds li:last-child{border-bottom:none}
.cmd-k{flex:none;width:92px;font-weight:700;color:var(--slate);font-size:14.5px;line-height:1.75}
.cmd-d{font-size:14px;color:#5F6670;line-height:1.75}
pre.prompt{white-space:pre-wrap;word-break:break-word;font-family:var(--sans);font-size:13px;line-height:1.8;
  max-height:380px;overflow:auto;margin:12px 0 0;color:var(--ink)}
.next{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 17px}
.next-l{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--slate)}
.next-p{margin:4px 0 12px;font-size:14px;color:#5F6670;line-height:1.8}
.next .btn1{display:block;width:100%}
.page-end{height:44px}
.toast{position:fixed;left:20px;right:20px;margin:0 auto;width:max-content;
  bottom:calc(22px + env(safe-area-inset-bottom));transform:translateY(16px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;line-height:1.6;
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:50;
  max-width:calc(100% - 40px);text-align:center}
.toast.on{opacity:1;transform:translateY(0)}
.sheet-bg{position:fixed;inset:0;background:rgba(46,52,61,.45);display:flex;align-items:flex-end;
  justify-content:center;z-index:60}
.sheet{background:var(--paper);width:100%;max-width:720px;border-radius:16px 16px 0 0;
  padding:18px 20px calc(18px + env(safe-area-inset-bottom))}
.sheet-t{font-family:var(--serif);font-size:17px;font-weight:700;margin-bottom:4px}
.sheet-p{font-size:13.5px;color:#6A7280;margin:0 0 10px;line-height:1.8}
.sheet textarea{width:100%;height:40vh;font-family:var(--sans);font-size:14px;line-height:1.7;
  border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;color:var(--ink);margin-bottom:12px}
.sheet .btn1{display:block;width:100%}

/* ---------- OARS日常對話練習 ---------- */
details.role.grp{margin-top:10px}
.grp-k{font-family:Georgia,"Times New Roman",serif;font-size:18px;font-weight:700;color:var(--slate);margin-right:9px}
.grp-d{font-size:12.5px;font-weight:400;color:var(--taupe)}
.roles{list-style:none;margin:10px 0 0;padding:0}
.roles li{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.7;color:var(--ink)}
.roles li:last-child{border-bottom:none}
.role-c{flex:none;width:28px;font-weight:700;color:var(--slate)}
.role-s{color:var(--taupe)}
.grp-note{font-size:12.5px;color:var(--taupe);margin:8px 0 0;line-height:1.7}
.stuck{padding:12px 0;border-bottom:1px dashed var(--line)}
.stuck:last-child{border-bottom:none;padding-bottom:0}
.stuck-t{font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:4px}
.stuck-say{font-size:14px;color:var(--sus);line-height:1.7}
.stuck-why{font-size:13.5px;color:#5F6670;line-height:1.7;margin:2px 0}
.stuck-fix{font-size:14px;color:var(--ink);line-height:1.7}
.stuck-fix b{color:var(--slate);margin-right:6px}
table.refs{width:100%;border-collapse:collapse;margin-top:8px;font-size:13.5px}
table.refs th{font-size:12px;color:var(--taupe);font-weight:600;text-align:left;padding:6px;border-bottom:1px solid var(--line)}
table.refs td{padding:9px 6px;border-bottom:1px dashed var(--line);vertical-align:top;color:var(--ink);line-height:1.6}
table.refs td.v{white-space:nowrap;font-family:var(--serif);font-weight:700}
.ref-tip{display:block;font-size:12.5px;color:#6A7280;margin-top:3px;line-height:1.7}
.safe{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 17px;margin-top:26px}
.safe-t{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--slate);margin-bottom:8px}
.safe ol{margin:0;padding-left:1.3em}
.safe li{font-size:14px;line-height:1.85;margin-bottom:8px;color:#5F6670}
.safe li b{display:block;color:var(--ink)}
.safe-n{font-size:12.5px;color:var(--taupe);margin:4px 0 0;line-height:1.7}

/* ---------- 安裝到手機 ---------- */
.inst{display:flex;align-items:center;gap:14px;background:var(--card);border:1px dashed #D3CCC3;border-radius:14px;
  padding:14px 14px 14px 16px;margin:0 0 40px}
.inst img{flex:none;width:52px;height:52px;border-radius:12px}
.inst-b{flex:1;min-width:0}
.inst-t{font-size:15px;font-weight:700;color:var(--ink);line-height:1.5}
.inst-d{font-size:12.5px;color:#6A7280;line-height:1.7}
.inst-steps{margin:6px 0 12px;padding-left:1.3em;font-size:14.5px;line-height:1.9;color:var(--ink)}
.inst-steps li{margin-bottom:6px}
.upd{position:fixed;left:0;right:0;bottom:0;z-index:80;display:none;align-items:center;justify-content:center;
  gap:10px;flex-wrap:wrap;background:var(--slate);color:#fff;font-size:14px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.15)}
.upd.on{display:flex}
.upd button{border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600}
.upd .go{background:#fff;color:var(--slate)}
.upd .later{color:rgba(255,255,255,.75)}

/* ---------- QR code ---------- */
.qr-btn{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.4);
  color:#fff;border-radius:999px;padding:7px 13px;font-size:13px;line-height:1;transition:.16s}
.qr-btn:hover{background:rgba(255,255,255,.12)}
.qr-bg{position:fixed;inset:0;background:var(--paper);z-index:70;display:flex;align-items:center;
  justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));overflow:auto}
.qr-box{width:100%;max-width:640px;text-align:center}
.qr-eye{font-size:13px;letter-spacing:.14em;color:var(--taupe);margin-bottom:6px}
.qr-title{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--ink);line-height:1.45;margin-bottom:18px}
.qr-img svg{display:block;width:min(78vw,58vh);height:auto;margin:0 auto;border-radius:6px}
.qr-url{margin:14px auto 0;font-size:13px;color:var(--taupe);word-break:break-all;line-height:1.6;max-width:520px}
.qr-opts{display:flex;justify-content:center;gap:6px;margin-top:16px}
.qr-opts button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;
  font-size:13px;color:#6A7280}
.qr-opts button[aria-pressed="true"]{background:var(--slate);border-color:var(--slate);color:#fff}
.qr-close{display:block;width:100%;max-width:320px;margin:20px auto 0}

/* ---------- 講師設定 ---------- */
.top-btns{flex:none;display:flex;align-items:center;gap:8px}
a.brand{white-space:nowrap}
a.brand small{white-space:normal}
@media(max-width:374px){
  .qr-btn{width:32px;height:32px;padding:0;justify-content:center}
  .qr-btn span{display:none}
}
.gear-btn{flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;
  border:1px solid rgba(255,255,255,.3);border-radius:50%;color:rgba(255,255,255,.85);transition:.16s}
.gear-btn:hover,.gear-btn[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff}
.act.off{border-style:dashed;background:#FCFBF9}
.act.off .act-t,.act.off .act-d{color:#8A9099}
.tag-off{margin-left:auto;font-size:11.5px;letter-spacing:.04em;padding:2px 8px;border-radius:4px;
  background:var(--sand);color:#6E6257}
.adm-bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:22px 0 -6px;padding:10px 14px;
  background:var(--sand);border-radius:10px;font-size:13px;line-height:1.7;color:#5F5449}
.adm-bar span{flex:1 1 15em}
.adm-bar button{font-size:13px;font-weight:600;color:var(--slate);padding:2px 0;border-bottom:1px solid #CFC8C0}
.closed{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 20px 22px;text-align:center}
.wrap > .closed{margin:14px 0 44px}
.closed-eye{font-size:12.5px;letter-spacing:.08em;color:var(--taupe);margin-bottom:6px}
.closed-t{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--ink);line-height:1.45;margin-bottom:6px}
.closed-p{margin:0 0 18px;font-size:14px;color:#6A7280;line-height:1.8}
.closed .btn1{display:block;width:100%;max-width:320px;margin:0 auto}
.loading{padding:80px 0;text-align:center;font-size:13.5px;letter-spacing:.08em;color:var(--taupe)}
.loading::before{content:"";display:block;width:24px;height:24px;margin:0 auto 12px;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--slate);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.adm-sec{margin-bottom:26px}
.fld-l{display:block;font-size:14px;font-weight:700;color:var(--ink);margin:0 0 8px}
.fld{display:block;width:100%;font-family:var(--sans);font-size:16px;line-height:1.5;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;-webkit-appearance:none;appearance:none}
.fld:focus{outline:none;border-color:var(--slate);box-shadow:0 0 0 3px rgba(90,100,114,.14)}
.fld::placeholder{color:#B3ADA5}
.fld-h{margin:7px 0 0;font-size:12.5px;color:var(--taupe);line-height:1.7}
.adm-form .btn1{display:block;width:100%}
.adm-err{min-height:1.7em;margin:8px 0 10px;font-size:13.5px;line-height:1.7;color:var(--sus)}
.sw-list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sw-row{position:relative;display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.sw-row:last-child{border-bottom:none}
.sw-b{flex:1;min-width:0}
.sw-eye{display:block;font-size:11.5px;letter-spacing:.14em;color:var(--taupe);line-height:1.6}
.sw-t{display:block;font-size:15.5px;font-weight:600;color:var(--ink);line-height:1.5}
.sw-st{flex:none;font-size:12.5px;font-weight:600;color:var(--slate)}
.sw-row.off .sw-t{color:#8A9099}
.sw-row.off .sw-st{color:var(--taupe);font-weight:400}
.sw-in{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.sw-ui{flex:none;position:relative;width:46px;height:28px;border-radius:999px;background:#D6CFC6;transition:background .18s}
.sw-ui::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(46,52,61,.22);transition:transform .18s}
.sw-in:checked + .sw-ui{background:var(--slate)}
.sw-in:checked + .sw-ui::after{transform:translateX(18px)}
.sw-in:focus-visible + .sw-ui{outline:2px solid var(--slate);outline-offset:3px}
.adm-act .btn1{display:block;width:100%}
.adm-hint{margin:9px 0 0;font-size:13px;line-height:1.7;color:var(--taupe);text-align:center}
.adm-hint.dirty{color:var(--sus);font-weight:600}
.adm-more{display:flex;gap:10px;margin-top:22px}
.adm-fn{margin:22px 0 0;font-size:12.5px;line-height:1.8;color:var(--taupe)}

/* ---------- OARS訪談練習 ---------- */
.act-s{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--slate);margin:-4px 0 8px}
.head-s{font-family:var(--serif);font-size:16.5px;font-weight:700;color:var(--slate);margin:-6px 0 10px}
.hook{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.hook-q{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.7;color:var(--ink)}
.hook-p{margin:8px 0 0;font-size:14px;line-height:1.8;color:#6A7280}
.task-pre{margin:-4px 0 12px;font-size:14px;line-height:1.8;color:var(--taupe)}
.steps li.key .task-t{font-weight:700}
.task-d{display:block;font-size:13px;line-height:1.75;color:#6A7280}
.quote{margin:14px 0 0;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:14px;line-height:1.7;color:var(--taupe)}
.roles2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role2{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.role2-t{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--slate);margin-bottom:3px}
.role2-d{font-size:13.5px;line-height:1.7;color:#5F6670}
.refs2{margin-top:24px}
.seg2{display:flex;gap:4px;background:var(--sand);border-radius:999px;padding:4px}
.seg2 button{flex:1;border-radius:999px;padding:8px 0;font-size:14.5px;color:#6A7280;transition:.16s}
.seg2 button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(46,52,61,.14)}
.seg2-h{margin:7px 0 16px;font-size:12.5px;line-height:1.7;color:var(--taupe);text-align:center}
.psteps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.psteps button{min-width:34px;border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:5px 11px;font-size:13px;color:#8A9099}
.psteps button.done{color:var(--slate);border-color:#C9CDD3}
.psteps button[aria-current="step"]{background:var(--slate);border-color:var(--slate);color:#fff;font-weight:700}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px}
.stage-h{display:flex;align-items:baseline;gap:9px;margin-bottom:14px}
.stage-n{flex:none;font-size:12.5px;letter-spacing:.06em;color:var(--taupe)}
.stage-t{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--slate)}
.stage-m{margin-left:auto;flex:none;font-size:12.5px;color:var(--taupe)}
.stage-q{margin:0 0 12px;font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.65;color:var(--ink)}
.stage-p{margin:0 0 10px;font-size:14.5px;line-height:1.8;color:#5F6670}
details.hint{margin-top:10px}
details.hint summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px;padding:4px 0;
  font-size:13px;color:var(--taupe)}
details.hint summary::-webkit-details-marker{display:none}
details.hint summary::after{content:"展開";font-size:12px;color:#B3ADA5;border-bottom:1px solid #D9D2C9;line-height:1.3}
details.hint[open] summary::after{content:"收起"}
.listen{background:#EEF0F3;border-radius:11px;padding:12px 15px;margin:6px 0 0}
.listen-t{font-size:15px;font-weight:700;line-height:1.6;color:var(--ink)}
.listen-d{margin-top:3px;font-size:13.5px;line-height:1.75;color:#5F6670}
.listen-e{margin-top:7px;font-size:13px;line-height:1.75;color:var(--taupe)}
.more-q{margin:10px 0 0;padding-left:1.2em;font-size:15px;line-height:1.85;color:var(--ink)}
.more-q li{margin:4px 0}
.ex-p{margin:12px 0 0;font-size:14.5px;line-height:1.9;color:var(--ink)}
.stage-check{margin:12px 0 0;font-size:14px;font-weight:700;line-height:1.7;color:var(--ink)}
.stage-nav{margin-top:16px}
.notes4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 6px}
.notes4 label{display:block;font-size:12.5px;font-weight:700;color:var(--slate);margin-bottom:4px}
.notes4 textarea{display:block;width:100%;min-height:84px;resize:vertical;font-family:var(--sans);font-size:16px;line-height:1.5;
  color:var(--ink);background:#FCFBF9;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.notes4 textarea:focus{outline:none;border-color:var(--slate);background:#fff}
.notes-act{text-align:right;margin-bottom:12px}
.notes-act button{font-size:12.5px;color:var(--taupe);border-bottom:1px solid #D9D2C9;padding:0}
.think{list-style:none;margin:0;padding:0}
.think li{padding:11px 0;border-bottom:1px dashed var(--line);font-family:var(--serif);font-size:17px;font-weight:700;
  line-height:1.7;color:var(--ink)}
.think li:last-child{border-bottom:none}
.fbq-l{margin:6px 0 0;padding-left:1.2em;font-size:15px;line-height:1.85;color:var(--ink)}
.fbq-l li{margin:3px 0}
.reveal{margin-top:18px}
.reveal .btn1{display:block;width:100%}
.ct{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px}
.ct + .ct{margin-top:10px}
.ct-h{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--slate)}
.ct-d{margin:2px 0 8px;font-size:13px;line-height:1.7;color:var(--taupe)}
.ct-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line)}
.ct-k{flex:none;width:30px;height:30px;margin-top:1px;border-radius:50%;background:var(--slate);color:#fff;
  font-family:Georgia,"Times New Roman",serif;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ct-n{font-size:15px;font-weight:700;line-height:1.5;color:var(--ink)}
.ct-from{font-size:12.5px;line-height:1.6;color:var(--slate)}
.ct-ex{font-size:14px;line-height:1.7;color:#5F6670}
.ct.cats{background:var(--chg-bg);border-color:#C6DACB}
.ct.cats .ct-h{color:var(--chg)}
.ct.cats .ct-k{background:var(--chg)}
.ct.cats .ct-row{border-top-color:#C6DACB}
.ct-note{padding:6px 0 10px;font-size:13px;line-height:1.7;color:var(--chg)}
.ct-ask{margin:14px 0 0;font-size:15px;font-weight:700;line-height:1.75;color:var(--ink)}

/* ---------- 諮詢實務演練 ---------- */
.lot{padding:20px 0 2px}
.lot-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 10px;font-size:17px;letter-spacing:.12em}
.or{display:flex;align-items:center;gap:12px;margin:18px 0 0;font-size:12px;color:#B3ADA5}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.drill-foot{margin:-24px 0 0;font-size:12.5px;color:var(--taupe);text-align:center}
.drill-lock{display:block;margin:16px auto 44px;font-size:12.5px;color:var(--taupe);border-bottom:1px solid #D9D2C9;padding:0}
details.role.dr{margin-bottom:10px}
details.role.dr .role-b{padding:2px 16px 14px}
.dr-p{margin:12px 0 0;font-size:15.5px;line-height:1.9;color:var(--ink)}
.dr-h{margin:12px 0 2px;font-size:12.5px;line-height:1.7;color:var(--taupe)}
.dr-q{margin:8px 0 0;border-radius:12px;padding:11px 15px;font-size:16px;line-height:1.8}
.dr-q.open{margin-top:12px;background:var(--sand);color:var(--ink);font-family:var(--serif);font-weight:700;font-size:17px}
.dr-q.sus{background:var(--sus-bg);color:#5E3A40}
.dr-q.chg{background:var(--chg-bg);color:#2F4F3A}
.dr-tag{display:inline-block;margin-left:8px;padding:0 9px;border-radius:999px;background:#fff;border:1px solid #C6DACB;
  color:var(--chg);font-family:var(--sans);font-size:12px;font-weight:700;line-height:1.7;vertical-align:1px;white-space:nowrap}
.dr-score{margin-top:12px}
.lot-bg{position:fixed;inset:0;z-index:75;background:rgba(46,52,61,.55);display:flex;align-items:center;justify-content:center;
  padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
.lot-box{position:relative;width:100%;max-width:400px;max-height:100%;overflow:auto;background:var(--paper);border-radius:20px;
  padding:26px 22px 22px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.lot-x{position:absolute;top:12px;right:14px;font-size:13px;color:var(--taupe);padding:4px 6px}
.lot-t{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--ink);letter-spacing:.12em}
.lot-left{margin:2px 0 16px;font-size:12.5px;color:var(--taupe)}
.lot-card{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:22px 16px;margin-bottom:18px}
.lot-card.spin{animation:drawPulse .15s ease-in-out infinite alternate}
.lot-card.done{border:2px solid var(--slate);background:#F3F4F6}
@keyframes drawPulse{from{transform:scale(.97)}to{transform:scale(1.02)}}
.lot-num{font-family:var(--serif);font-size:44px;font-weight:700;line-height:1.1;color:var(--slate)}
.lot-k{margin-top:4px;font-size:12px;color:var(--taupe)}
.lot-title{margin-top:2px;font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.45;color:var(--ink)}
.lot-stu{margin-top:4px;font-size:13.5px;color:#6A7280}
.lot-go{display:block;width:100%}
.lot-act{display:flex;gap:10px}
.lot-act .btn2{flex:1}
.lot-act .btn1{flex:2}
.lot-wait{padding:12px 0;font-size:15px;color:var(--taupe)}

@media(max-width:520px){
  .head-t{font-size:22px}
  .counter-v{font-size:44px}
  .round-v{font-size:42px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media print{
  .top,.tabs,.tools,.back,.filters,.foot,.count-row,.round-b,.qr-btn,.gear-btn,.adm-bar{display:none!important}
  body{background:#fff;font-size:12pt}
  .script p,.mono p{font-size:12pt;line-height:1.9}
  .pane{padding:0}
  details.role{border:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#/">動機式晤談練習
      <small id="brandSub">運用動機式晤談於學校諮詢工作</small>
    </a>
    <div class="top-btns">
      <button class="qr-btn" id="qrBtn" type="button" aria-label="顯示這一頁的 QR code">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3z"/><path d="M21 14v.01"/><path d="M14 21h.01"/><path d="M17 21h4v-4"/></svg>
        <span>QR code</span>
      </button>
      <button class="gear-btn" id="gearBtn" type="button" aria-label="講師設定" title="講師設定">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="app"></main>

     練習資料。要新增或修改內容，改下面兩段就好。

     MONOLOGUES：OARS諮詢情境練習的獨白
       text        獨白本文（不含引號）
       core        情緒核心，只在「回饋」分頁的設定裡出現
       notes.feel  心裡最深的感受
       notes.more  被接住的時候，可以再多說（陣列）
       notes.when  對方給建議時的反應：label 是情境，text 是反應

     SEGMENTS：改變型對話辨識的朗讀稿
       paras       每段由若干 [文字, 類型] 組成
                   類型　c = 改變型對話　s = 維持型對話　n = 中性
       key         判讀欄開頭必須是「改變」或「維持」，程式靠這個上色

     BASICBOT：OARS日常對話練習
       prompt      Prompt 全文，學員按「複製 Prompt」拿到的就是這段
       groups      角色池 A–E，要和 Prompt 第六節一致
       其他欄位    頁面上的說明文字，取自操作說明簡報

     PEER：OARS訪談練習｜認識你的教室夥伴
       stages      四段訪談；q.teach 是教學版、q.counsel 是輔導版，main 主問題、more 備用問題
       listen      「這段要聽」；listenD 補充說明，cues 是可以留意的話
       sum、swap   整理與摘要、換你問
       reveal      回顧最後揭曉的改變型對話類型（DARN、CATs），用詞與例句同工作坊簡報

     DRILL：諮詢實務演練（模擬個案腳本）
       topics      七題；s1 第一次諮詢、s2 第二次（追蹤），只有 s1 有導師角色設定 role
       change.tag  改變型對話的類型，用中文寫（渴望、能力、理由、需要、承諾、啟動、行動）
       labels、hints  區塊標題與說明；「演練者」指接受演練的人

       prompt      主 prompt 全文，學員按「複製主 prompt」拿到的就是這段
       cards       情境卡 A–G；text 是複製出去的卡片全文

     "回應質疑：面對「你們輔導的效果不好」能否不防衛、先接住焦慮",

     "表現回饋：能否幫導師看到「聯絡簿互動」的治療意義",

<script>
(function(){
  "use strict";
  var M = window.MONOLOGUES || [];
  var S = window.SEGMENTS || [];
  var AI = window.AIBOT || {prompt:"", cards:[]};
  var BASIC = window.BASICBOT || {prompt:"", moves:[], steps:[], groups:[], cmds:[], stuck:[], refs:[], safety:[]};
  var PEER = window.PEER || {stages:[], versions:[]};
  var DRILL = window.DRILL || {topics:[], labels:{}, hints:{}, sessions:[]};
  var app = document.getElementById("app");

  if(!M.length && !S.length){
    app.innerHTML='<div class="wrap" style="padding:60px 20px;text-align:center;color:#6A7280">'+
      '<p style="font-size:16px;margin:0 0 10px"><b>找不到練習資料</b></p>'+
      '<p style="font-size:14px;line-height:1.9;margin:0">檔案可能不完整，請重新下載。</p></div>';
    return;
  }

  /* ---------- 狀態 ---------- */
  var store = {
    get:function(k,d){ try{ var v=localStorage.getItem("mi_"+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
    set:function(k,v){ try{ localStorage.setItem("mi_"+k, JSON.stringify(v)); }catch(e){} }
  };
  try{ localStorage.removeItem("mi_drawn"); }catch(e){}   // v15 的抽籤紀錄，v16 起不再記錄
  var state = {
    fs:  store.get("fs",1),            // 字級：0 小 1 中 2 大
    oa:  "全部", ot:"mono",            // OARS：篩選、分頁
    round:1, roundId:null,             // OARS：目前第幾輪
    fa:  "全部", tab:"read",           // 改變型對話：篩選、分頁
    tally:{c:0,s:0}, tallyId:null,     // 改變型對話：計數
    aa:  "全部",                       // AI諮詢技巧練習機器人：篩選
    dsId:null, ds:1,                   // 諮詢實務演練：目前的題目、第一次或第二次諮詢
    pt:"intro", ps:0, prv:false,       // OARS訪談練習：分頁、第幾段、是否已揭曉
    pv:  store.get("pv","teach")       // OARS訪談練習：教學版或輔導版
  };
  var FS=["17px","19px","22px"], LH=["1.95","2.0","2.05"];
  function applyFS(){
    document.documentElement.style.setProperty("--fs",FS[state.fs]);
    document.documentElement.style.setProperty("--lh",LH[state.fs]);
  }
  applyFS();

  /* ---------- 工具 ---------- */
  function el(tag,cls,txt){ var e=document.createElement(tag); if(cls)e.className=cls;
    if(txt!==undefined)e.textContent=txt; return e; }
  function go(h){ location.hash=h; }
  function find(arr,id){ for(var i=0;i<arr.length;i++){ if(arr[i].id===id) return arr[i]; } return null; }
  function count(arr,a){ return arr.filter(function(x){ return x.audience===a; }).length; }

  // 重新繪製後的捲動位置：top 回到頂端；keep 停在原處；tab 停在分頁列
  function settle(mode,y,head){
    if(mode==="keep"){ window.scrollTo(0,y); return; }
    if(mode==="tab" && head){ window.scrollTo(0, Math.min(y, head.offsetTop+head.offsetHeight)); return; }
    window.scrollTo(0,0);
  }

  function backBtn(label,hash){
    var b=el("button","back","← "+label);
    b.onclick=function(){ go(hash); };
    return b;
  }

  function filters(cur,onPick){
    var f=el("div","filters");
    ["全部","教師","家長"].forEach(function(v){
      var b=el("button",null,v); b.setAttribute("aria-pressed",cur===v);
      b.onclick=function(){ onPick(v); }; f.appendChild(b);
    });
    return f;
  }

  function tabBar(items,cur,onPick){
    var tabs=el("div","tabs"); tabs.setAttribute("role","tablist");
    items.forEach(function(t){
      var b=el("button",null,t[1]);
      b.setAttribute("role","tab");
      b.setAttribute("aria-selected", cur===t[0]);
      b.onclick=function(){ onPick(t[0]); };
      tabs.appendChild(b);
    });
    return tabs;
  }

  function fontTools(pane,rerender){
    var t=el("div","tools");
    t.appendChild(el("span",null,"字級"));
    ["小","中","大"].forEach(function(lb,i){
      var b=el("button",null,lb);
      b.setAttribute("aria-pressed", state.fs===i);
      b.onclick=function(){ state.fs=i; store.set("fs",i); applyFS(); rerender(); };
      t.appendChild(b);
    });
    pane.appendChild(t);
  }

  function emptyNote(list){
    var none=el("p"); none.style.cssText="color:#8A9099;font-size:14px;padding:20px 0";
    none.textContent="這個條件下沒有內容。"; list.appendChild(none);
  }

  /* ==========================================================
     首頁
     ACTS 是練習清單：首頁的卡片、講師設定的開關都從這裡來。
       id    代碼。和網址（#/basic）、後台試算表的「代碼」欄一樣，不要改
       def   後台還沒有這個練習的設定時，預設開放（true）或不開放（false）
     之後新增練習：在這裡加一項、在 route() 接上它的頁面，講師設定就會多一個開關。
     ========================================================== */
  var ACTS = [
    { id:"basic", eye:"融入", title:"OARS日常對話練習", def:true,
      desc:"跟 ChatGPT 練日常對話。它扮演你要陪伴的人，你練問、肯認、反映、摘要四個傾聽動作，練完當場拿到回饋報告。",
      meta:function(){ return "五組角色．共 "+BASIC.groups.reduce(function(n,g){ return n+g.roles.length; },0)+" 個"; } },
    { id:"peer", eye:"融入", title:"OARS訪談練習", sub:"認識你的教室夥伴", def:false,
      desc:"兩人一組，傾聽者用 OARS 問四段，分享者談自己的教學或輔導經驗。傾聽者要找出能連到對方改變動機的資訊，最後用摘要說給對方聽。",
      meta:function(){ return PEER.stages.length+" 段訪談．教學版、輔導版"; } },
    { id:"oars", eye:"融入", title:"OARS諮詢情境練習", def:true,
      desc:"先把人接住，再談改變。一人念獨白、扮演教師或家長，另一人只用 OARS 回應，連續來回五輪。",
      meta:function(){ return M.length+" 段獨白．教師 "+count(M,"教師")+"．家長 "+count(M,"家長"); } },
    { id:"talk", eye:"誘發", title:"辨識改變型對話", def:true,
      desc:"一人念、一人聽，找出改變型對話與維持型對話，念完一起對答案。",
      meta:function(){ return S.length+" 段朗讀稿．教師 "+count(S,"教師")+"．家長 "+count(S,"家長"); } },
    { id:"ai", eye:"誘發", title:"AI諮詢技巧練習機器人", def:true,
      desc:"ChatGPT 扮演來談的教師或家長，你當諮詢者，練辨識、邀請、強化完整的一輪。複製主 prompt 和情境卡，貼進 ChatGPT 就能開始。",
      meta:function(){ return AI.cards.length+" 張情境卡．教師 "+count(AI.cards,"教師")+"．家長 "+count(AI.cards,"家長"); } },
    { id:"drill", eye:"綜合", title:"諮詢實務演練", sub:"模擬個案腳本", def:true,
      desc:"諮詢能力演練口試用的模擬個案。扮演導師的人看腳本：演練者做不好時丟出維持型對話，做對時釋放改變型對話，再對照評分重點。",
      meta:function(){ return "需要密碼．"+DRILL.topics.length+" 題 × 2 次諮詢．國小導師"; } }
  ];
  function actById(id){ for(var i=0;i<ACTS.length;i++){ if(ACTS[i].id===id) return ACTS[i]; } return null; }

  function home(){
    app.innerHTML="";
    var w=el("div","wrap");
    var admin=isAdmin();
    if(admin) w.appendChild(adminBar());
    var acts=el("div","acts"), shown=0;
    ACTS.forEach(function(a){
      var open=isOpen(a.id);
      if(!open && !admin) return;
      var c=el("button","act"+(open?"":" off"));
      c.onclick=function(){ go("#/"+a.id); };
      var eye=el("div","act-eye");
      eye.appendChild(el("span",null,a.eye));
      if(!open) eye.appendChild(el("span","tag-off","這次未開放"));
      c.appendChild(eye);
      c.appendChild(el("div","act-t",a.title));
      if(a.sub) c.appendChild(el("div","act-s",a.sub));
      c.appendChild(el("div","act-d",a.desc));
      c.appendChild(el("div","act-m",a.meta()));
      acts.appendChild(c);
      shown++;
    });
    if(!shown) acts.appendChild(waitCard());
    w.appendChild(acts);
    if(!isStandalone()) w.appendChild(installCard());
    app.appendChild(w);
    window.scrollTo(0,0);
  }

  // 一個練習都還沒開放
  function waitCard(){
    var c=el("div","closed");
    c.appendChild(el("div","closed-t","練習還沒開放"));
    c.appendChild(el("p","closed-p","講師開放之後，按「重新整理」就會出現。"));
    var b=el("button","btn1","重新整理");
    b.onclick=function(){
      b.disabled=true; b.textContent="讀取中…";
      refreshCfg(true).then(function(){
        if(!document.body.contains(b)) return;
        b.disabled=false; b.textContent="重新整理";
        toast("還沒開放，請稍候");
      });
    };
    c.appendChild(b);
    return c;
  }

  // 學員打開這次沒開放的練習（舊的 QR code、書籤、同組夥伴傳來的連結）
  function closedPage(id){
    var a=actById(id);
    app.innerHTML="";
    var w=el("div","wrap");
    w.appendChild(backBtn("回首頁","#/"));
    var c=el("div","closed");
    if(a) c.appendChild(el("div","closed-eye",a.title));
    c.appendChild(el("div","closed-t","這個練習這次沒有開放"));
    c.appendChild(el("p","closed-p","請回首頁，選講師說的練習。"));
    var b=el("button","btn1","回首頁");
    b.onclick=function(){ go("#/"); };
    c.appendChild(b);
    w.appendChild(c);
    app.appendChild(w);
    window.scrollTo(0,0);
  }

  function loadingView(){
    app.innerHTML="";
    var w=el("div","wrap");
    var l=el("div","loading","載入中…");
    l.setAttribute("role","status");
    w.appendChild(l);
    app.appendChild(w);
  }

  /* ==========================================================
     OARS諮詢情境練習
     ========================================================== */
  var STEPS=[
    "兩人一組：一人扮演教師或家長，念獨白開場；一人當諮詢者。",
    "諮詢者只用開放式問句、肯認和反映回應。",
    "第五輪用兩三句摘要收尾。",
    "交換角色，換一段獨白。兩人都當過諮詢者之後，互相回饋。"
  ];
  var OARS=[
    {k:"O", name:"開放式問句", how:"問不能用一兩個字回答的問題。", ex:"「可以多說一點那時候的情況嗎？」"},
    {k:"A", name:"肯認", how:"具體說出對方的努力、在意的事或優點。", ex:"「這麼累了，你還在想辦法。」"},
    {k:"R", name:"反映式傾聽", how:"用自己的話，說出對方的意思和感受。", ex:"「這件事讓你很難受。」"},
    {k:"S", name:"摘要", how:"兩三句話，把對方說過的重點串起來。", ex:"「我聽到的是⋯⋯，同時⋯⋯。我有漏掉什麼嗎？」"}
  ];

  function oarsList(){
    state.roundId=null;
    app.innerHTML="";
    var w=el("div","wrap");
    w.appendChild(backBtn("回首頁","#/"));

    var hd=el("div","head");
    hd.appendChild(el("div","head-n","融入"));
    hd.appendChild(el("h1","head-t","OARS諮詢情境練習"));
    hd.appendChild(el("p","head-p","先把人接住，再談改變。用 OARS 回應一段教師或家長的心聲。"));
    w.appendChild(hd);

    w.appendChild(el("div","challenge","挑戰：連續來回五輪，一句建議都不給"));
    var ol=el("ol","steps");
    STEPS.forEach(function(t,i){
      var li=el("li");
      li.appendChild(el("span","step-n",String(i+1)));
      li.appendChild(el("span",null,t));
      ol.appendChild(li);
    });
    w.appendChild(ol);

    w.appendChild(filters(state.oa,function(v){ state.oa=v; oarsList(); }));

    var list=el("div","list");
    var shown=M.filter(function(m){ return state.oa==="全部"||m.audience===state.oa; });
    if(!shown.length) emptyNote(list);
    shown.forEach(function(m){
      var c=el("button","card");
      c.onclick=function(){ go("#/oars/"+m.id); };
      var h=el("div","card-h");
      h.appendChild(el("div","card-n",m.num));
      h.appendChild(el("div","card-t",m.title));
      c.appendChild(h);
      var mm=el("div","card-m");
      mm.appendChild(el("span","tag tag-a",m.audience+"諮詢"));
      c.appendChild(mm);
      list.appendChild(c);
    });
    w.appendChild(list);
    app.appendChild(w);
    window.scrollTo(0,0);
  }

  function oarsDetail(m,mode){
    if(state.roundId!==m.id){ state.roundId=m.id; state.round=1; state.ot="mono"; }
    var y=window.scrollY;
    app.innerHTML="";
    var w=el("div","wrap");
    w.appendChild(backBtn("全部獨白","#/oars"));

    var hd=el("div","head");
    hd.appendChild(el("div","head-n","獨白"+m.num));
    hd.appendChild(el("h1","head-t",m.title));
    var mm=el("div","head-m"); mm.style.marginBottom="0";
    mm.appendChild(el("span","tag tag-a",m.audience+"諮詢"));
    hd.appendChild(mm);
    w.appendChild(hd);

    w.appendChild(tabBar([["mono","獨白"],["resp","回應"],["fb","回饋"]], state.ot,
      function(v){ state.ot=v; oarsDetail(m,"tab"); }));

    var pane=el("div","pane");
    if(state.ot==="mono") monoPane(pane,m);
    else if(state.ot==="resp") respPane(pane,m);
    else fbPane(pane,m);
    w.appendChild(pane);
    app.appendChild(w);
    settle(mode,y,hd);
  }

  function roleRow(label,content){
    var r=el("div","role-r");
    r.appendChild(el("div","role-l",label));
    if(Array.isArray(content)){
      var ul=el("ul");
      content.forEach(function(t){ ul.appendChild(el("li",null,t)); });
      r.appendChild(ul);
    } else {
      r.appendChild(el("div","role-v",content));
    }
    return r;
  }

  function monoPane(pane,m){
    fontTools(pane,function(){ oarsDetail(m,"keep"); });
    var who = m.audience==="教師" ? "這位老師" : "這位家長";
    var n=el("div","note");
    n.innerHTML="<b>念完後繼續扮演"+who+"，順著對話自然回應。</b>當諮詢者的人不用看這一頁，切到「回應」。";
    pane.appendChild(n);

    var q=el("div","mono");
    q.appendChild(el("p",null,"「"+m.text+"」"));
    pane.appendChild(q);

    var d=el("details","role");
    d.appendChild(el("summary",null,"角色提示｜只給扮演的人看"));
    var b=el("div","role-b");
    b.appendChild(el("p","role-rule","不用一次說完。對方接住你，就多說一點；對方開始給建議或急著安慰，就說少一點。"));
    b.appendChild(roleRow("心裡最深的感受", m.notes.feel));
    b.appendChild(roleRow("被接住的時候，可以再多說", m.notes.more));
    b.appendChild(roleRow(m.notes.when.label, m.notes.when.text));
    d.appendChild(b);
    pane.appendChild(d);
  }

  function respPane(pane,m){
    var last = state.round===5;
    var card=el("div","round"+(last?" last":""));
    var top=el("div","round-top");
    top.appendChild(el("span",null,"第"));

  function len(t){ return t.replace(/[，。？…、！　]/g,"").length; }
  function runs(seg){ var r=[]; seg.paras.forEach(function(p){ p.forEach(function(x){ r.push(x); }); }); return r; }

  function ribbon(seg,opts){
    opts=opts||{};
    var wrap=el("div","ribbon"+(opts.big?" big":"")+(opts.plain?" plain":"")+(opts.reveal?" reveal":""));
    runs(seg).forEach(function(x){
      var s=el("span"); s.className="rb-"+x[1];
      s.style.flex=len(x[0])+" 0 0"; wrap.appendChild(s);
    });
    wrap.setAttribute("role","img");
    wrap.setAttribute("aria-label", opts.plain ? "語言脈絡帶，尚未顯示" :
      "語言脈絡帶：改變型對話 "+seg.stats.chg+"%，維持型對話 "+seg.stats.sus+"%，中性 "+seg.stats.neu+"%");
    return wrap;
  }

  function manualCopy(text,title){
    var bg=el("div","sheet-bg");
    var sh=el("div","sheet");
    sh.setAttribute("role","dialog");
    sh.appendChild(el("div","sheet-t",title));
    sh.appendChild(el("p","sheet-p","這個瀏覽器不讓網頁直接複製。請長按下面的文字，全選之後複製。"));
    var ta=el("textarea"); ta.value=text; ta.readOnly=true;
    sh.appendChild(ta);
    var close=el("button","btn1","關閉");
    function shut(){ if(bg.parentNode) bg.parentNode.removeChild(bg); }
    close.onclick=shut;
    bg.onclick=function(e){ if(e.target===bg) shut(); };
    sh.appendChild(close);
    bg.appendChild(sh);
    document.body.appendChild(bg);
    ta.focus(); ta.select();
    ta.scrollTop=0;
    setTimeout(function(){ ta.scrollTop=0; },0);
  }

  function copyText(text,title,onDone){
    function fallback(){
      var ta=document.createElement("textarea");
      ta.value=text; ta.setAttribute("readonly","");
      ta.style.cssText="position:fixed;top:0;left:0;opacity:0;pointer-events:none";
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0,text.length);
      var ok=false;
      try{ ok=document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta);
      if(ok) onDone(); else manualCopy(text,title);
    }
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(onDone,fallback);
    } else {
      fallback();
    }
  }

        err.textContent=(j && j.err) || "沒有開啟成功，請再試一次。";

  // 抽籤：每次都從全部題目裡抽一題，抽過的題目還會再抽到；不留紀錄
  var lotOpen=null;
  function closeLottery(){
    if(!lotOpen) return;
    clearTimeout(lotOpen.st.timer);
    document.removeEventListener("keydown",lotOpen.onKey);
    if(lotOpen.bg.parentNode) lotOpen.bg.parentNode.removeChild(lotOpen.bg);
    lotOpen=null;
  }
  function openLottery(){
    closeLottery();
    var bg=el("div","lot-bg");
    bg.setAttribute("role","dialog"); bg.setAttribute("aria-modal","true"); bg.setAttribute("aria-label","抽籤");
    var box=el("div","lot-box");
    bg.appendChild(box);
    var st={ phase:"idle", show:null, pick:null, timer:null };
    var av=DRILL.topics;
    function draw(){
      box.innerHTML="";
      var x=el("button","lot-x","關閉"); x.onclick=closeLottery; box.appendChild(x);
      box.appendChild(el("div","lot-t","抽籤"));
      box.appendChild(el("div","lot-left","每次都從 "+av.length+" 題裡抽"));
      var cur=st.show||av[0];
      var card=el("div","lot-card"+(st.phase==="spin"?" spin":st.phase==="result"?" done":""));
      card.appendChild(el("div","lot-num",cur.num));
      card.appendChild(el("div","lot-k","題目"+cur.num));
      card.appendChild(el("div","lot-title",cur.title));
      card.appendChild(el("div","lot-stu",cur.student));
      box.appendChild(card);
      if(st.phase==="idle"){
        var start=el("button","btn1 lot-go","開始抽籤"); start.onclick=spin; box.appendChild(start);
      } else if(st.phase==="spin"){
        box.appendChild(el("div","lot-wait","抽籤中…"));
      } else {
        var act=el("div","lot-act");
        var again=el("button","btn2","重抽");
        again.onclick=function(){ st.phase="idle"; st.pick=null; st.show=null; draw(); };
        var ok=el("button","btn1","確認，進入腳本");
        ok.onclick=function(){
          var id=st.pick.id;
          closeLottery();
          go("#/drill/"+id);
        };
        act.appendChild(again); act.appendChild(ok);
        box.appendChild(act);
      }
    }
    function spin(){
      st.pick=av[Math.floor(Math.random()*av.length)];
      if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
        st.show=st.pick; st.phase="result"; draw(); return;
      }
      st.phase="spin";
      var ticks=18+Math.floor(Math.random()*6), i=0;
      (function step(){
        i++;
        if(i>=ticks){ st.show=st.pick; st.phase="result"; draw(); return; }
        st.show=av[Math.floor(Math.random()*av.length)];
        draw();
        st.timer=setTimeout(step, 60+Math.round(Math.pow(i/ticks,2)*240));
      })();
    }
    bg.onclick=function(e){ if(e.target===bg) closeLottery(); };
    var onKey=function(e){ if(e.key==="Escape") closeLottery(); };
    document.addEventListener("keydown",onKey);
    lotOpen={ bg:bg, onKey:onKey, st:st };
    document.body.appendChild(bg);
    draw();
  }

  /* ==========================================================

  function pageLabel(){
    var p=location.hash.replace(/^#\/?/,"").split("/"), id=parseInt(p[1],10);
    if(p[0]==="basic") return "OARS日常對話練習";
    if(p[0]==="peer") return "OARS訪談練習｜認識你的教室夥伴";
    if(p[0]==="oars"){ var m=find(M,id); return m ? "OARS諮詢情境練習｜獨白"+m.num+"　"+m.title : "OARS諮詢情境練習"; }
    if(p[0]==="talk"){ var s=find(S,id); return s ? "辨識改變型對話｜段落"+s.num+"　"+s.title : "辨識改變型對話"; }
    if(p[0]==="ai"){
      var c=null, k=(p[1]||"").toUpperCase();
      AI.cards.forEach(function(x){ if(x.id===k) c=x; });
      return c ? "AI諮詢技巧練習機器人｜卡片 "+c.id+"　"+c.title : "AI諮詢技巧練習機器人";
    }
    if(p[0]==="admin") return "講師設定";
    if(p[0]==="drill"){ var dt=findTopic(id); return dt ? "諮詢實務演練｜題目"+dt.num+"　"+dt.title : "諮詢實務演練"; }
    return "首頁";
  }

  function qrSvg(text){
    var q=window.qrcode(0,"M");
    q.addData(text); q.make();
    var n=q.getModuleCount(), pad=4, size=n+pad*2, d="";
    for(var r=0;r<n;r++){ for(var c=0;c<n;c++){ if(q.isDark(r,c)) d+="M"+(c+pad)+" "+(r+pad)+"h1v1h-1z"; } }
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+size+' '+size+'" shape-rendering="crispEdges" role="img" aria-label="QR code">'+
      '<rect width="'+size+'" height="'+size+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
  }

  var qrOpen=null;
  function closeQR(){
    if(!qrOpen) return;
    document.removeEventListener("keydown",qrOpen.onKey);
    if(qrOpen.bg.parentNode) qrOpen.bg.parentNode.removeChild(qrOpen.bg);
    qrOpen=null;
    var b=document.getElementById("qrBtn"); if(b) b.focus();
  }

  function openQR(){
    if(!window.qrcode) return;
    closeQR();
    var homeUrl=location.href.split("#")[0];
    var hereUrl=location.href;
    var label=pageLabel();
    var isHome = label==="首頁" || hereUrl===homeUrl || /#\/?$/.test(hereUrl);
    var which = isHome ? "home" : "here";

    var bg=el("div","qr-bg");
    bg.setAttribute("role","dialog"); bg.setAttribute("aria-modal","true"); bg.setAttribute("aria-label","QR code");
    var box=el("div","qr-box");
    box.appendChild(el("div","qr-eye","掃描開啟"));
    var title=el("div","qr-title");
    var img=el("div","qr-img");
    var url=el("div","qr-url");
    box.appendChild(title); box.appendChild(img); box.appendChild(url);

    function draw(){
      var u = which==="home" ? homeUrl : hereUrl;
      title.textContent = which==="home" ? "動機式晤談練習" : label;
      img.innerHTML = qrSvg(u);
      url.textContent = u;
      if(opts){ [].forEach.call(opts.children,function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-v")===which); }); }
    }

    var opts=null;
    if(!isHome){
      opts=el("div","qr-opts");
      [["here","這一頁"],["home","首頁"]].forEach(function(o){
        var b=el("button",null,o[1]); b.setAttribute("data-v",o[0]);
        b.onclick=function(){ which=o[0]; draw(); };
        opts.appendChild(b);
      });
      box.appendChild(opts);
    }

    var close=el("button","btn1 qr-close","關閉");
    close.onclick=closeQR;
    box.appendChild(close);
    bg.appendChild(box);
    document.body.appendChild(bg);
    draw();

    var onKey=function(e){ if(e.key==="Escape") closeQR(); };
    document.addEventListener("keydown",onKey);
    qrOpen={bg:bg,onKey:onKey};
    close.focus();
  }

  // Service worker：離線也能打開；部署新版後提示更新（第一次開啟不提示）
  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    var hadController=!!navigator.serviceWorker.controller;

  /* ==========================================================
     講師設定：這次工作坊開放哪些練習
     設定存在 Google 試算表，透過 Apps Script 讀寫；網址寫在 backend.js。
     backend.js 沒有網址時，所有練習都開放，講師設定頁會說明怎麼接上。
     學員：先用上次存下的設定立刻顯示，再到後台拿最新的；
           回到首頁、切回這個網頁時會重新讀取（15 秒內不重複讀）。
     講師登入後，首頁列出全部練習，沒開放的標「這次未開放」，點進去可以預覽。
     ========================================================== */
  var BACKEND = (typeof window.MI_BACKEND==="string") ? window.MI_BACKEND.trim() : "";
  var CFG=null, cfgAt=0, cfgBusy=null, view="", booted=false;
  var sess = {
    get:function(k){ try{ return sessionStorage.getItem("mi_"+k); }catch(e){ return null; } },
    set:function(k,v){ try{ if(v===null) sessionStorage.removeItem("mi_"+k); else sessionStorage.setItem("mi_"+k,v); }catch(e){} }
  };
  var adm = { token:BACKEND ? sess.get("tok") : null, sheet:sess.get("sheet"), draft:null, busy:false, msg:"" };

  function normCfg(c){
    var o={ title:"", acts:{} };
    if(c && typeof c.title==="string") o.title=c.title.replace(/\s+/g," ").trim().slice(0,60);
    if(c && c.acts && typeof c.acts==="object"){
      Object.keys(c.acts).forEach(function(k){ if(/^[a-z][a-z0-9_-]{0,30}$/.test(k)) o.acts[k]=c.acts[k]===true; });
    }
    return o;
  }
  (function(){
    var saved=store.get("cfg",null);
    if(BACKEND && saved && saved.src===BACKEND && saved.cfg) CFG=normCfg(saved.cfg);
  })();

  function isOpen(id){
    var a=actById(id), d = a ? a.def!==false : true;
    if(!BACKEND) return true;            // 沒有後台：全部開放
    if(!CFG) return d;
    return Object.prototype.hasOwnProperty.call(CFG.acts,id) ? CFG.acts[id] : d;
  }
  function isAdmin(){ return !!adm.token; }
  function canSee(id){ return isAdmin() || isOpen(id); }

  var brandSub=document.getElementById("brandSub");
  var SUB_DEFAULT=brandSub ? brandSub.textContent : "";
  function applyTitle(){ if(brandSub) brandSub.textContent=(CFG && CFG.title) || SUB_DEFAULT; }
  applyTitle();

  // 跟後台講話。Apps Script 會先 302 轉址到 googleusercontent.com 再回 JSON；
  // POST 用 text/plain，瀏覽器才不會先送 OPTIONS 預檢（Apps Script 不回應預檢）。
  function api(method,body,ms){
    return new Promise(function(resolve,reject){
      var done=false, ctl=window.AbortController ? new AbortController() : null;
      function finish(fn,v){ if(done) return; done=true; clearTimeout(timer); fn(v); }
      var timer=setTimeout(function(){ finish(reject,new Error("timeout")); if(ctl) ctl.abort(); }, ms||12000);
      var url=BACKEND, opt={ method:method, redirect:"follow", credentials:"omit" };
      if(ctl) opt.signal=ctl.signal;
      if(method==="GET") url+=(url.indexOf("?")<0 ? "?" : "&")+"t="+Date.now();
      else { opt.headers={"Content-Type":"text/plain;charset=utf-8"}; opt.body=JSON.stringify(body||{}); }
      fetch(url,opt).then(function(r){
        if(!r.ok) throw new Error("HTTP "+r.status);
        return r.json();
      }).then(function(j){ finish(resolve,j); },function(e){ finish(reject,e); });
    });
  }

  function refreshCfg(force){
    if(!BACKEND) return Promise.resolve(false);
    if(cfgBusy) return cfgBusy;
    if(!force && Date.now()-cfgAt<15000) return Promise.resolve(false);
    cfgAt=Date.now();
    cfgBusy=api("GET",null,10000).then(function(j){
      cfgBusy=null;
      if(j && j.ok && j.cfg){ setCfg(j.cfg); return true; }
      return false;
    },function(){ cfgBusy=null; return false; });
    return cfgBusy;
  }

  function cfgSig(){ return ACTS.map(function(a){ return isOpen(a.id)?1:0; }).join("")+"|"+((CFG && CFG.title)||""); }
  function keepScroll(fn){ var y=window.pageYOffset; fn(); window.scrollTo(0,y); }
  function setCfg(c,quiet){
    var before=cfgSig();
    CFG=normCfg(c);
    store.set("cfg",{src:BACKEND,cfg:CFG});
    applyTitle();
    if(quiet || !booted || cfgSig()===before) return;
    if(view==="home" || view==="closed") route();
    else if(view==="admin" && !adm.draft && !adm.busy) keepScroll(adminPage);
  }

    n.innerHTML="<b>還沒連上後台，所以現在所有練習都開放。</b><br>把 Apps Script 部署好的網址（結尾是 /exec）貼進網站的 backend.js，重新部署之後，這裡就能登入設定。";

  function admLogin(pane){
    if(/\/dev(\?|$)/.test(BACKEND)){
      var warn=el("div","note");
      warn.innerHTML="<b>backend.js 的網址結尾是 /dev。</b>那是測試用的網址，只有你自己打得開。請改用部署後拿到、結尾是 /exec 的網址。";
      pane.appendChild(warn);
    }
    var f=el("form","adm-form"); f.noValidate=true;
    var lb=el("label","fld-l","管理密碼"); lb.htmlFor="admPw";
    var ip=el("input","fld"); ip.type="password"; ip.id="admPw"; ip.name="password";
    ip.setAttribute("autocomplete","current-password");
    ip.setAttribute("enterkeyhint","go");
    var err=el("p","adm-err",adm.msg||""); err.setAttribute("role","alert");
    var btn=el("button","btn1","登入"); btn.type="submit";
    f.appendChild(lb); f.appendChild(ip); f.appendChild(err); f.appendChild(btn);
    f.onsubmit=function(e){
      e.preventDefault();
      if(adm.busy) return;
      var pw=ip.value.trim();
      if(!pw){ err.textContent="請輸入密碼。"; ip.focus(); return; }
      adm.busy=true; btn.disabled=true; btn.textContent="登入中…"; err.textContent="";
      api("POST",{action:"login",pw:pw},20000).then(function(j){
        adm.busy=false;
        if(j && j.ok && j.token){
          adm.token=j.token; sess.set("tok",j.token);
          if(j.sheet){ adm.sheet=j.sheet; sess.set("sheet",j.sheet); }
          adm.msg="";
          if(j.cfg) setCfg(j.cfg,true);
          if(view==="admin") adminPage();
          return;
        }
        btn.disabled=false; btn.textContent="登入";
        err.textContent=(j && j.err) || "沒有登入成功，請再試一次。";
        ip.focus(); ip.select();
      },function(){
        adm.busy=false; btn.disabled=false; btn.textContent="登入";
        err.textContent="連不上後台。請確認網路，以及 backend.js 的網址正確、部署時「誰可以存取」選了「所有人」。";
      });
    };
    pane.appendChild(f);
    pane.appendChild(el("p","adm-fn","密碼寫在 Apps Script 程式碼最上面的 ADMIN_PASSWORD。"));
    if(window.matchMedia && window.matchMedia("(hover:hover)").matches) setTimeout(function(){ ip.focus(); },0);
  }

  function admSaved(){
    var o={ title:(CFG && CFG.title) || "", acts:{} };
    ACTS.forEach(function(a){ o.acts[a.id]=isOpen(a.id); });
    return o;
  }
  function admSame(a,b){
    if(a.title.trim()!==b.title.trim()) return false;
    for(var i=0;i<ACTS.length;i++){ var id=ACTS[i].id; if(!!a.acts[id]!==!!b.acts[id]) return false; }
    return true;
  }

  function admSettings(pane){
    var cur=adm.draft || admSaved();
    function draft(){
      if(!adm.draft){
        var d={ title:cur.title, acts:{} };
        Object.keys(cur.acts).forEach(function(k){ d.acts[k]=cur.acts[k]; });
        adm.draft=d; cur=d;
      }
      return adm.draft;
    }

    var s1=el("div","adm-sec");
    var tl=el("label","fld-l","工作坊名稱"); tl.htmlFor="admTitle";
    var ti=el("input","fld"); ti.type="text"; ti.id="admTitle"; ti.maxLength=60;
    ti.value=cur.title; ti.placeholder=SUB_DEFAULT;
    ti.oninput=function(){ draft().title=ti.value; mark(); };
    s1.appendChild(tl); s1.appendChild(ti);
    s1.appendChild(el("p","fld-h","顯示在網頁標題下方。留白就用「"+SUB_DEFAULT+"」。"));
    pane.appendChild(s1);

    var s2=el("div","adm-sec");
    s2.appendChild(el("div","fld-l","開放的練習"));
    var list=el("div","sw-list");
    ACTS.forEach(function(a){
      var on=!!cur.acts[a.id];
      var row=el("label","sw-row"+(on?"":" off"));
      var b=el("span","sw-b");
      b.appendChild(el("span","sw-eye",a.eye));
      b.appendChild(el("span","sw-t",a.title));
      var st=el("span","sw-st",on?"開放":"不開放");
      var cb=el("input","sw-in"); cb.type="checkbox"; cb.checked=on;
      cb.setAttribute("role","switch"); cb.setAttribute("aria-label",a.title);
      cb.onchange=function(){
        draft().acts[a.id]=cb.checked;
        st.textContent=cb.checked?"開放":"不開放";
        row.className="sw-row"+(cb.checked?"":" off");
        mark();
      };
      row.appendChild(b); row.appendChild(st); row.appendChild(cb); row.appendChild(el("span","sw-ui"));
      list.appendChild(row);
    });
    s2.appendChild(list);
    pane.appendChild(s2);

    var act=el("div","adm-act");
    var save=el("button","btn1","儲存設定");
    var hint=el("p","adm-hint");
    function mark(){
      var dirty=!!adm.draft && !admSame(adm.draft,admSaved());
      hint.className="adm-hint"+(dirty?" dirty":"");
      hint.textContent=dirty ? "有變更還沒儲存。" : "這就是學員現在看到的設定。";
    }
    save.onclick=function(){ admSave(save,hint); };
    act.appendChild(save); act.appendChild(hint);
    pane.appendChild(act);
    mark();

    var more=el("div","adm-more");
    if(adm.sheet){
      var sh=el("a","btn2","打開試算表"); sh.href=adm.sheet; sh.target="_blank"; sh.rel="noopener";
      more.appendChild(sh);
    }
    var out=el("button","btn2","登出"); out.onclick=logout;
    more.appendChild(out);
    pane.appendChild(more);

    pane.appendChild(el("p","adm-fn","關閉的練習只是從首頁收起來，內容仍在網頁裡，不是保密用。學員回到首頁或重新整理，就會看到新的設定。"));
  }

  function admSave(btn,hint){
    if(adm.busy) return;
    var d=adm.draft || admSaved();
    var payload={ action:"save", token:adm.token, title:d.title.trim(),
      acts:ACTS.map(function(a){ return { id:a.id, name:a.sub ? a.title+"｜"+a.sub : a.title, on:!!d.acts[a.id] }; }) };
    adm.busy=true; btn.disabled=true; btn.textContent="儲存中…";
    api("POST",payload,25000).then(function(j){
      adm.busy=false;
      if(j && j.ok && j.cfg){
        adm.draft=null;
        if(j.sheet){ adm.sheet=j.sheet; sess.set("sheet",j.sheet); }
        setCfg(j.cfg,true);
        if(view==="admin") keepScroll(adminPage);
        toast("已儲存。學員回到首頁就會看到新的設定。");
        return;
      }
      if(j && j.code==="auth"){
        adm.token=null; sess.set("tok",null);
        adm.msg="登入逾時，請重新登入。剛才的變更還留著，登入後再按一次「儲存設定」。";
        if(view==="admin") adminPage();
        return;
      }
      btn.disabled=false; btn.textContent="儲存設定";
      hint.className="adm-hint dirty"; hint.textContent=(j && j.err) || "沒有存到，請再試一次。";
    },function(){
      adm.busy=false; btn.disabled=false; btn.textContent="儲存設定";
      hint.className="adm-hint dirty"; hint.textContent="連不上後台，設定沒有存到。請檢查網路後再試一次。";
    });
  }

  var gearBtn=document.getElementById("gearBtn");
  if(gearBtn) gearBtn.onclick=function(){ go("#/admin"); };

  /* ==========================================================
     路由
     #/              首頁
     #/basic         OARS日常對話練習
     #/peer          OARS訪談練習｜認識你的教室夥伴
     #/oars、#/oars/3   OARS諮詢情境練習
     #/talk、#/talk/7   辨識改變型對話
     #/ai、#/ai/C       AI諮詢技巧練習機器人（C 是卡片代號，會捲到那張卡並標出來）
     #/drill、#/drill/3 諮詢實務演練（要輸入密碼；3 是題目編號）
     #/admin         講師設定
     #/7             舊版網址，自動轉到 #/talk/7
     沒開放的練習：學員看到「這次沒有開放」；講師登入後照常打開。
     ========================================================== */
  function route(){
    booted=true;
    var p=location.hash.replace(/^#\/?/,"").split("/");
    if(/^\d+$/.test(p[0])){ location.replace("#/talk/"+p[0]); return; }
    if(p[0]==="admin"){ adminPage(); }
    else if(actById(p[0]) && !canSee(p[0])){ view="closed"; closedPage(p[0]); }
    else if(p[0]==="basic"){ view="page"; basicPage(); }
    else if(p[0]==="peer"){ view="page"; state.prv=false; peerPage(); }
    else if(p[0]==="oars"){
      view="page";
      var m=find(M,parseInt(p[1],10));
      if(m) oarsDetail(m); else oarsList();
    }
    else if(p[0]==="talk"){
      view="page";
      var s=find(S,parseInt(p[1],10));
      if(s) talkDetail(s); else talkList();
    }
    else if(p[0]==="drill"){ view="page"; drillPage(parseInt(p[1],10)); }
    else if(p[0]==="ai"){
      view="page";
      var hl = p[1] ? p[1].toUpperCase() : null;
      if(hl) state.aa="全部";
      aiPage(hl);
    }
    else { view="home"; home(); }
    if(gearBtn){ if(view==="admin") gearBtn.setAttribute("aria-current","page"); else gearBtn.removeAttribute("aria-current"); }
    document.body.classList.toggle("is-home", view==="home");
  }

  window.addEventListener("hashchange",function(){
    closeQR(); closeLottery(); route();
    if(view==="home") refreshCfg(false);
    else if(view==="admin" && isAdmin()) refreshCfg(true);
  });
  document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") refreshCfg(false); });
  window.addEventListener("pageshow",function(e){ if(e.persisted) refreshCfg(false); });
  window.addEventListener("online",function(){ refreshCfg(true); });

  if(BACKEND && !CFG){
    // 第一次打開、手上還沒有設定：等後台回覆（最多 6 秒），免得學員先看到沒開放的練習
    loadingView();
    var bootTimer=setTimeout(function(){ bootTimer=null; route(); },6000);
    refreshCfg(true).then(function(ok){
      if(ok) return true;
      return new Promise(function(r){ setTimeout(r,1000+Math.random()*1500); }).then(function(){ return refreshCfg(true); });
    }).then(function(){ if(bootTimer){ clearTimeout(bootTimer); bootTimer=null; route(); } });
  } else {
    route();
    refreshCfg(true);
  }
})();
</script>
</body>
</html>
